[project]
name = "security-agentic-workflow"
version = "0.1.0"
description = "Kafka-driven, configuration-first cybersecurity workflow built with LangGraph."
requires-python = ">=3.11"
dependencies = [
  "confluent-kafka>=2.6,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langgraph>=0.2,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "psycopg[binary]>=3.2,<4",
  "pyyaml>=6,<7",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1"]
nist-mapper = ["numpy>=1.24,<3", "sentence-transformers>=3,<6"]

[project.scripts]
security-workflow-worker = "security_workflow.worker:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
