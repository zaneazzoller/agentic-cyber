# Air-gapped local stack. Set VLLM_IMAGE and VLLM_MODEL_DIR in .env before starting.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: security_workflow
      POSTGRES_USER: security_workflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a non-default local database password in .env}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U security_workflow -d security_workflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  vllm:
    image: ${VLLM_IMAGE:?Set this to the exact image included in the transfer kit}
    command:
      - --model
      - /models/llama-3.2-1b-instruct
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - "4096"
      - --served-model-name
      - meta-llama/Llama-3.2-1B-Instruct
    ports:
      - "8000:8000"
    volumes:
      - ${VLLM_MODEL_DIR:?Set this to the transferred Llama model directory}:/models/llama-3.2-1b-instruct:ro
    gpus: all
    ipc: host
